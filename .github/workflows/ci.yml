name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only superseded PR runs are cancelled; every main push is validated.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Backend is split in three: lint once, run the test suite as 4 parallel
  # shards, then combine coverage in the job that keeps the "Backend Tests"
  # name. On 4-core runners the unsplit suite took ~4 min; each shard takes
  # about a quarter of that.
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    outputs:
      run_backend: ${{ steps.backend-changes.outputs.run_backend }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect backend-relevant changes
        id: backend-changes
        working-directory: .
        run: python3 .github/ci/changes.py

      - name: Test the shard splitter
        working-directory: .
        run: python3 .github/ci/test_backend_shards.py

      - name: Set up Python
        if: steps.backend-changes.outputs.run_backend != 'false'
        uses: actions/setup-python@v7
        with:
          # Single source of truth with the Docker image: CI must test the
          # same interpreter the backend ships with.
          python-version-file: backend/.python-version

      - name: Set up uv
        if: steps.backend-changes.outputs.run_backend != 'false'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version

      - name: Install dependencies
        if: steps.backend-changes.outputs.run_backend != 'false'
        run: uv sync --locked --all-extras

      - name: Lint with Ruff
        if: steps.backend-changes.outputs.run_backend != 'false'
        run: uv run --no-sync ruff check .

      - name: Type check with ty
        if: steps.backend-changes.outputs.run_backend != 'false'
        run: uv run --no-sync ty check .

  backend-shard:
    name: Backend Tests (shard ${{ matrix.shard }})
    needs: backend-lint
    if: needs.backend-lint.outputs.run_backend != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: securo_test
          POSTGRES_PASSWORD: securo_test
          POSTGRES_DB: securo_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U securo_test -d securo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run test shard with coverage
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://securo_test:securo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/securo_test
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
        run: |
          # shellcheck disable=SC2046 # the file list is meant to word-split
          uv run --no-sync pytest -n auto --dist loadfile --cov=app --cov-report= -ra -W error \
            $(python3 ../.github/ci/backend_shards.py ${{ matrix.shard }} 4)

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: backend/.coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  backend-tests:
    name: Backend Tests
    needs: [backend-lint, backend-shard]
    if: always()
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is not available in a step-level `if:` — using
      # it there makes the whole workflow unparseable and no job runs at all.
      # Job-level `env` may read secrets, and `env` may be read from a step
      # `if:`, so this indirection is how the badge step below stays gated on
      # having the token rather than on being a particular repository.
      HAS_GIST_TOKEN: ${{ secrets.GIST_TOKEN != '' }}
      RUN_BACKEND: ${{ needs.backend-lint.outputs.run_backend }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Fail if lint or any shard failed
        working-directory: .
        if: needs.backend-lint.result != 'success' || (env.RUN_BACKEND != 'false' && needs.backend-shard.result != 'success')
        run: |
          echo "lint: ${{ needs.backend-lint.result }}, shards: ${{ needs.backend-shard.result }}"
          exit 1

      - name: Skip backend tests
        if: env.RUN_BACKEND == 'false'
        working-directory: .
        run: echo "No backend-relevant changes; skipping backend test suite."

      - uses: actions/checkout@v7
        if: env.RUN_BACKEND != 'false'

      - name: Set up Python
        if: env.RUN_BACKEND != 'false'
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        if: env.RUN_BACKEND != 'false'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version

      - name: Install dependencies
        if: env.RUN_BACKEND != 'false'
        run: uv sync --locked --all-extras

      - name: Download coverage data
        if: env.RUN_BACKEND != 'false'
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-shard-*
          path: backend
          merge-multiple: true

      - name: Combine coverage
        if: env.RUN_BACKEND != 'false'
        run: |
          uv run --no-sync coverage combine .coverage.shard-*
          uv run --no-sync coverage xml
          uv run --no-sync coverage report --fail-under=60

      - name: Upload coverage report
        if: env.RUN_BACKEND != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Extract coverage percentage
        if: github.ref == 'refs/heads/main' && env.RUN_BACKEND != 'false'
        id: coverage
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100))")
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"

      # Gated on the secret rather than on a repository name. Forks have no
      # GIST_TOKEN, so without this the whole Backend Tests job goes red on
      # "Missing auth secret" *after* the tests have already passed -- which
      # reads as a test failure and hid two real ones here for days.
      #
      # Upstream fixes this by hardcoding `github.repository ==
      # 'securo-finance/securo'` (#667, 1a26ae0). Same effect, but it asserts
      # who you are instead of what you have, so every fork inherits a step
      # that can never run and no way to enable it. 1a26ae0 was merged on
      # 2026-08-28 and this line conflicted as expected; ours was kept.
      - name: Update coverage badge
        if: env.HAS_GIST_TOKEN == 'true' && github.ref == 'refs/heads/main' && env.RUN_BACKEND != 'false'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ae627b744aaa2ba89d850ea541c311be
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 90

  migration-chain:
    name: Migration Chain
    runs-on: ubuntu-latest

    steps:
      # No `ref:` override, so on a pull request this is the merge with the
      # base branch. That is the whole point: a revision id that only clashes
      # once both sides are together is visible here and nowhere else.
      - uses: actions/checkout@v7

      - name: Test CI change selection
        run: python3 .github/ci/test_changes.py

      - name: Check the Alembic revision chain
        run: python3 backend/scripts/check_migration_chain.py

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect frontend-relevant changes
        id: frontend-changes
        working-directory: .
        run: python3 .github/ci/changes.py

      - name: Skip frontend checks
        if: steps.frontend-changes.outputs.run_frontend == 'false'
        run: echo "No frontend-relevant changes; skipping frontend checks."

      - name: Set up Node.js
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm ci

      - name: Lint
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm run lint -- --max-warnings=0

      - name: Type check & Build
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm run build

      - name: Run tests
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm test

  helm-checks:
    name: Helm Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect helm-relevant changes
        id: helm-changes
        run: python3 .github/ci/changes.py

      - name: Skip helm checks
        if: steps.helm-changes.outputs.run_helm == 'false'
        run: echo "No helm-relevant changes; skipping helm lint."

      - name: Set up Helm
        if: steps.helm-changes.outputs.run_helm != 'false'
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Lint Helm Chart
        if: steps.helm-changes.outputs.run_helm != 'false'
        run: helm lint charts/securo

      - name: Validate Helm Chart with Kubeconform
        if: steps.helm-changes.outputs.run_helm != 'false'
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/

          helm template securo-test charts/securo | kubeconform -summary -strict
