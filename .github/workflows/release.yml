name: Build and Push Docker Images

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/securo-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/securo-frontend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-helm:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Helm Chart
        run: |
          # Strip the 'v' prefix from the release tag if it exists, as helm chart version needs to be semver without v.
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          # Point the chart at the images this workflow actually built, which
          # live under ${{ env.IMAGE_PREFIX }} — the OWNER of the repository
          # running the release, not a hardcoded one. On a fork the build jobs
          # already push to the fork's namespace; before this, the chart was
          # rewritten to upstream's images carrying the fork's version number,
          # so a fork release produced a chart that deployed upstream's code.
          # That comes up healthy and is silently wrong, which is worse than
          # failing.
          #
          # home/sources/icon/links deliberately still point upstream: they
          # describe the PROJECT, which is upstream's. Only artifacthub.io/images
          # describes what this chart pulls, so only it follows the build.
          echo "Injecting version $VERSION into artifacthub.io/images annotation"
          sed -i "s|ghcr.io/securo-finance/securo-backend:latest|${{ env.IMAGE_PREFIX }}/securo-backend:${VERSION}|g" charts/securo/Chart.yaml
          sed -i "s|ghcr.io/securo-finance/securo-frontend:latest|${{ env.IMAGE_PREFIX }}/securo-frontend:${VERSION}|g" charts/securo/Chart.yaml

          # values.yaml needs BOTH halves rewritten. Rewriting only the tag
          # leaves repository: pointing at upstream with a fork version tag —
          # the same wrong-owner bug in a second file, surviving a fix to
          # Chart.yaml alone. Only the two application images use `tag: latest`
          # (pgvector is pg16, redis is 8-alpine), so the blanket tag replace
          # cannot touch the dependencies.
          echo "Injecting version $VERSION into values.yaml"
          sed -i "s|repository: ghcr.io/securo-finance/securo-|repository: ${{ env.IMAGE_PREFIX }}/securo-|g" charts/securo/values.yaml
          sed -i "s|tag: latest|tag: ${VERSION}|g" charts/securo/values.yaml

          # Fail loudly rather than shipping a chart that points somewhere
          # unintended. A sed that matches nothing is silent, and every failure
          # this block guards against is the silently-healthy kind.
          echo "Verifying no image reference still points at another owner"
          if grep -rn "ghcr.io/securo-finance/securo-" charts/securo/Chart.yaml charts/securo/values.yaml; then
            echo "::error::Chart still references ghcr.io/securo-finance images after rewrite."
            exit 1
          fi
          if grep -rn "tag: latest" charts/securo/values.yaml; then
            echo "::error::values.yaml still contains 'tag: latest' after version injection."
            exit 1
          fi
          echo "Chart image references:"
          grep -n "repository:\|image: ghcr" charts/securo/Chart.yaml charts/securo/values.yaml

          echo "Packaging chart version $VERSION"
          helm package charts/securo --version "$VERSION" --app-version "$VERSION"

          helm push securo-$VERSION.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Push Artifact Hub Metadata
        run: |
          # Artifact Hub reads this from the chart's own path, not the parent
          # namespace: `helm push ... /charts` publishes to /charts/securo, so
          # the metadata has to carry the same prefix or it is never found.
          oras push ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/securo:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/securo/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
