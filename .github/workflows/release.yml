name: Build and Push Docker Images

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/securo-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push backend image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/securo-frontend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push frontend image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Render charts/securo with deploy/values.yaml, pin both images by digest,
  # and write the result into deploy/manifests.yaml -- the commit that
  # writes the digest IS the deploy, same pattern as luqmanbello/worth's
  # deploy.yml (homelab ADR-0140). Argo CD watches deploy/ on main and
  # applies whatever plain manifests it finds there; it never runs Helm
  # itself and is never given values, so this job is the only place the
  # chart and the running cluster are connected.
  #
  # Retrigger loop: N/A here, unlike worth. worth's deploy.yml guards with
  # `paths-ignore: [deploy/**]` because it triggers on `push: branches:
  # [main]`, so a push touching only deploy/** would otherwise retrigger
  # itself. This workflow triggers on `release: types: [published]`
  # instead -- pushing a commit to main does not publish a GitHub Release,
  # so the write-back below cannot retrigger this workflow no matter what
  # paths it touches. Separately, and just as sufficient on its own: pushes
  # made with the default GITHUB_TOKEN never trigger any workflow run at
  # all. A paths-ignore guard here would be dead code guarding against an
  # event that can't happen.
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Serialize write-backs to main rather than race two releases
      # published close together. Not ref-based (the ref here is a release
      # tag, different every time and so useless as a lock key) -- a
      # constant key is what actually serializes pushes to the same branch.
      group: securo-deploy-manifests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # release-triggered checkouts default to the tag's commit, not a
          # branch -- the write-back must land on main, not a detached HEAD.
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Render deploy/manifests.yaml
        run: |
          set -euo pipefail
          helm template securo charts/securo -f deploy/values.yaml \
            --namespace securo --skip-tests > deploy/manifests.yaml

      - name: Pin images by digest
        env:
          BACKEND_IMAGE: ghcr.io/luqmanbello/securo-backend
          FRONTEND_IMAGE: ghcr.io/luqmanbello/securo-frontend
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ ! "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build-backend produced no usable digest: '$BACKEND_DIGEST'"
            exit 1
          fi
          if [[ ! "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build-frontend produced no usable digest: '$FRONTEND_DIGEST'"
            exit 1
          fi

          # The chart quotes image refs (`image: "repo:tag"`), unlike
          # worth's hand-written deployment.yaml -- these patterns match
          # helm template's actual output, not worth's.
          #
          # backend's repository+tag is shared by four always-present
          # containers: the backend Deployment, the celery-worker Deployment,
          # the celery-beat Deployment, and the one-shot migration Job (all
          # run `.Values.backend.image.repository`). frontend appears once.
          # The mcp-server Deployment runs the backend image too, but only
          # when `mcpServer.enabled` is true -- so the expected count is 4 or
          # 5 depending on a toggle the owner is entitled to flip. Derive it
          # from what was actually rendered rather than hardcoding, and still
          # fail loudly on any other number: a count outside that means the
          # chart's templates changed shape (a container added/removed, or
          # the image field's quoting changed) and the sed below would either
          # silently miss a container or over-match -- fail loudly instead of
          # shipping a manifest with a stale or half-pinned image.
          #
          # This guard hardcoded 4 until 2026-08-26, so re-enabling mcpServer
          # in ecb7432 wedged the deploy job -- the same failure mode the /mcp
          # routing check below was already rewritten to avoid, reintroduced
          # one step over. An absolute assertion about something the owner can
          # toggle is a trap whichever way it points; that applies to counting
          # containers as much as to asserting a route.
          if grep -q "component: mcp-server" deploy/manifests.yaml; then
            backend_expected=5
          else
            backend_expected=4
          fi
          backend_before=$(grep -c "image: \"${BACKEND_IMAGE}:" deploy/manifests.yaml || true)
          if [[ "$backend_before" -ne "$backend_expected" ]]; then
            echo "::error::expected ${backend_expected} managed ${BACKEND_IMAGE} image lines in deploy/manifests.yaml, found ${backend_before}"
            exit 1
          fi
          frontend_before=$(grep -c "image: \"${FRONTEND_IMAGE}:" deploy/manifests.yaml || true)
          if [[ "$frontend_before" -ne 1 ]]; then
            echo "::error::expected 1 managed ${FRONTEND_IMAGE} image line in deploy/manifests.yaml, found ${frontend_before}"
            exit 1
          fi

          sed -i -E "s|image: \"${BACKEND_IMAGE}:[^\"]*\"|image: \"${BACKEND_IMAGE}@${BACKEND_DIGEST}\"|" \
            deploy/manifests.yaml
          sed -i -E "s|image: \"${FRONTEND_IMAGE}:[^\"]*\"|image: \"${FRONTEND_IMAGE}@${FRONTEND_DIGEST}\"|" \
            deploy/manifests.yaml

          backend_after=$(grep -c "image: \"${BACKEND_IMAGE}@sha256:" deploy/manifests.yaml || true)
          if [[ "$backend_after" -ne "$backend_expected" ]]; then
            echo "::error::expected ${backend_expected} digest-pinned ${BACKEND_IMAGE} image lines after substitution, found ${backend_after}"
            exit 1
          fi
          frontend_after=$(grep -c "image: \"${FRONTEND_IMAGE}@sha256:" deploy/manifests.yaml || true)
          if [[ "$frontend_after" -ne 1 ]]; then
            echo "::error::expected 1 digest-pinned ${FRONTEND_IMAGE} image line after substitution, found ${frontend_after}"
            exit 1
          fi

          # No image this fork's Argo CD app should ever run by tag: a
          # validator elsewhere fails the deploy if any
          # ghcr.io/luqmanbello/securo- image lacks @sha256:, so catch the
          # same condition here first, before it's a commit.
          if grep -n "ghcr.io/luqmanbello/securo-[a-z]*:" deploy/manifests.yaml; then
            echo "::error::a ghcr.io/luqmanbello/securo- image above is still pinned by tag, not digest."
            exit 1
          fi

          # Upstream's images must never survive into what Argo CD applies:
          # they pull, come up Healthy, and contain none of this fork's code
          # (no Access Bank provider, no NGN currency).
          if grep -n "ghcr.io/securo-finance/" deploy/manifests.yaml; then
            echo "::error::deploy/manifests.yaml still references an upstream ghcr.io/securo-finance/ image."
            exit 1
          fi

          # The agents MCP server must never be published on the Gateway.
          #
          # This check tolerates mcpServer.enabled being either true or false,
          # deliberately. An earlier version asserted the component was always
          # PRESENT; homelab-platform simultaneously had one asserting it was
          # always ABSENT. Theirs wedged the promotion pipeline permanently the
          # day Luqman changed his mind -- the fix could not ship through the
          # pipeline it was blocking. An absolute assertion about something the
          # owner is entitled to toggle is a trap whichever way it points.
          #
          # So assert the INVARIANT instead: whatever the toggle says, nothing
          # routes /mcp. deploy/kustomization.yaml declares the HTTPRoute rules
          # list outright rather than deleting a rule by index, so this holds in
          # both states by construction -- /mcp is absent because it is not
          # written, not because something removed it.
          if grep -q "value: /mcp" deploy/kustomization.yaml; then
            echo "::error::deploy/kustomization.yaml declares an HTTPRoute rule for /mcp; the agents MCP server must not be externally routed."
            exit 1
          fi

          if ! grep -q "kind: HTTPRoute" deploy/kustomization.yaml; then
            echo "::error::deploy/kustomization.yaml no longer patches the HTTPRoute; enabling mcpServer would publish /mcp on the Gateway as a side effect."
            exit 1
          fi

          # And the chart side, so a chart change is noticed rather than
          # silently overridden: if mcp-server is deployed, the chart is still
          # expected to be the thing adding /mcp that we are overriding.
          if grep -q "component: mcp-server" deploy/manifests.yaml; then
            if ! grep -q "value: /mcp" deploy/manifests.yaml; then
              echo "::notice::mcp-server is deployed but the chart no longer renders a /mcp route; the HTTPRoute override in kustomization.yaml may now be redundant."
            fi
          fi

      - name: Commit and push
        env:
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.digest }}
        run: |
          set -euo pipefail

          if git diff --quiet -- deploy/manifests.yaml; then
            echo "rendered manifests unchanged; nothing to promote"
            exit 0
          fi

          backend_short="${BACKEND_DIGEST#sha256:}"
          backend_short="${backend_short:0:12}"
          frontend_short="${FRONTEND_DIGEST#sha256:}"
          frontend_short="${frontend_short:0:12}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/manifests.yaml
          git commit -m "deploy: backend@${backend_short} frontend@${frontend_short}"

          # Rebase-and-retry, never force: main has other writers, and
          # worth's deploy.yml records the first homelab digest write-back
          # losing exactly this race.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push the rendered manifests after 3 rebases"
          exit 1

  build-helm:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Helm Chart
        run: |
          # Strip the 'v' prefix from the release tag if it exists, as helm chart version needs to be semver without v.
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          # Point the chart at the images this workflow actually built, which
          # live under ${{ env.IMAGE_PREFIX }} — the OWNER of the repository
          # running the release, not a hardcoded one. On a fork the build jobs
          # already push to the fork's namespace; before this, the chart was
          # rewritten to upstream's images carrying the fork's version number,
          # so a fork release produced a chart that deployed upstream's code.
          # That comes up healthy and is silently wrong, which is worse than
          # failing.
          #
          # home/sources/icon/links deliberately still point upstream: they
          # describe the PROJECT, which is upstream's. Only artifacthub.io/images
          # describes what this chart pulls, so only it follows the build.
          echo "Injecting version $VERSION into artifacthub.io/images annotation"
          sed -i "s|ghcr.io/securo-finance/securo-backend:latest|${{ env.IMAGE_PREFIX }}/securo-backend:${VERSION}|g" charts/securo/Chart.yaml
          sed -i "s|ghcr.io/securo-finance/securo-frontend:latest|${{ env.IMAGE_PREFIX }}/securo-frontend:${VERSION}|g" charts/securo/Chart.yaml

          # values.yaml needs BOTH halves rewritten. Rewriting only the tag
          # leaves repository: pointing at upstream with a fork version tag —
          # the same wrong-owner bug in a second file, surviving a fix to
          # Chart.yaml alone. Only the two application images use `tag: latest`
          # (pgvector is pg16, redis is 8-alpine), so the blanket tag replace
          # cannot touch the dependencies.
          echo "Injecting version $VERSION into values.yaml"
          sed -i "s|repository: ghcr.io/securo-finance/securo-|repository: ${{ env.IMAGE_PREFIX }}/securo-|g" charts/securo/values.yaml
          sed -i "s|tag: latest|tag: ${VERSION}|g" charts/securo/values.yaml

          # Fail loudly rather than shipping a chart that points somewhere
          # unintended. A sed that matches nothing is silent, and every failure
          # this block guards against is the silently-healthy kind.
          echo "Verifying no image reference still points at another owner"
          if grep -rn "ghcr.io/securo-finance/securo-" charts/securo/Chart.yaml charts/securo/values.yaml; then
            echo "::error::Chart still references ghcr.io/securo-finance images after rewrite."
            exit 1
          fi
          if grep -rn "tag: latest" charts/securo/values.yaml; then
            echo "::error::values.yaml still contains 'tag: latest' after version injection."
            exit 1
          fi
          echo "Chart image references:"
          grep -n "repository:\|image: ghcr" charts/securo/Chart.yaml charts/securo/values.yaml

          echo "Packaging chart version $VERSION"
          helm package charts/securo --version "$VERSION" --app-version "$VERSION"

          helm push securo-$VERSION.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Push Artifact Hub Metadata
        run: |
          # Artifact Hub reads this from the chart's own path, not the parent
          # namespace: `helm push ... /charts` publishes to /charts/securo, so
          # the metadata has to carry the same prefix or it is never found.
          oras push ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/securo:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/securo/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
