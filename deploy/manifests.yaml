# Source: securo/templates/backend/job-migration.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: securo-migration
  labels:
    helm.sh/chart: securo-0.15.0
    app.kubernetes.io/name: securo
    app.kubernetes.io/instance: securo
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: securo
        app.kubernetes.io/instance: securo
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: "ghcr.io/luqmanbello/securo-backend@sha256:34d9bcb5df5669d679bad54ffca041395781fb7e909969b5a4ce2c1863793a88"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Starting database migration..."
              for i in $(seq 1 30); do
                if alembic upgrade head; then
                  echo "Migration successful."
                  exit 0
                fi
                echo "Migration failed (database might not be ready). Retrying in 5 seconds..."
                sleep 5
              done
              echo "Migration failed after multiple retries."
              exit 1
          envFrom:
            - configMapRef:
                name: securo-config
            - secretRef:
                name: securo-runtime
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi

