apiVersion: apps/v1
kind: Deployment
metadata:
  name: securo-frontend
  labels:
    helm.sh/chart: securo-0.15.0
    app.kubernetes.io/name: securo
    app.kubernetes.io/instance: securo
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: securo
      app.kubernetes.io/instance: securo
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/config: d37336291f450f44fa55c052d2d602609d0298b1cf9d7a1647bacfbe960f53dc
        checksum/nginx-config: 097edaa98f2109112bfb287302deb74b5352c830edbbd751ba23787c4bf5d6ec
      labels:
        app.kubernetes.io/name: securo
        app.kubernetes.io/instance: securo
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "ghcr.io/luqmanbello/securo-frontend@sha256:f26de2b103f0d938d81a35873b59b9096b90c4ab90d5680a2eff726f1eaad7fc"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            # Fully qualified on purpose. Since #696 the nginx config reaches the
            # backend through `set $upstream ${BACKEND_URL}` + `proxy_pass
            # $upstream`, which makes nginx do its own DNS instead of letting the
            # OS resolver do it. nginx's `resolver` does NOT apply the search
            # domains in /etc/resolv.conf, so a bare Service name is sent to
            # kube-dns as an absolute query and comes back NXDOMAIN — every /api
            # request 502s with "securo-backend could not be resolved (3: Host
            # not found)" while `wget http://securo-backend:8000` from the very
            # same pod succeeds, because glibc appends the search suffixes.
            #
            # That asymmetry is the whole trap: the pod's DNS is fine, so the
            # obvious checks all pass. Name the Service in full and nginx has
            # nothing left to guess.
            - name: BACKEND_URL
              value: "http://securo-backend.securo.svc.cluster.local:8000"
            - name: FRONTEND_URL
              value: "https://securo.local.luqmanlabs.com"
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: nginx-template
          configMap:
            name: securo-frontend-nginx

