apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: securo

resources:
  - manifests.yaml
  - ciliumnetworkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/name: securo
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: argocd
    includeSelectors: true

# charts/securo/templates/backend/job-migration.yaml ships as a Helm hook
# (`helm.sh/hook: post-install,post-upgrade`), which means nothing once
# `helm template` has flattened it into manifests.yaml and Argo CD is
# syncing it as a plain Kustomize-sourced resource -- Argo only interprets
# `helm.sh/hook` when an Application's source is itself a Helm chart, not a
# directory it runs Kustomize over.
#
# Left alone, that makes the second-ever sync fail outright: batch/v1 Job
# .spec.template is immutable, so re-applying `securo-migration` with a new
# image digest errors instead of updating, and the whole sync gets stuck
# behind it. This patch adds Argo's own Sync-hook annotations so Argo
# deletes and recreates the Job on every sync instead of trying to patch it
# in place -- BeforeHookCreation deletes the previous run's Job first, which
# is what makes the immutable field a non-issue.
#
# There are deliberately NO imagePullSecrets here. Both images are public
# (verified 2026-08-25 by anonymous token pull against ghcr.io: HTTP 200 with
# no credentials), because packages published by Actions inherit the
# repository's visibility and luqmanbello/securo is public.
#
# An earlier revision patched `ghcr-pull` onto every workload just in case.
# Removed, because a Secret reference the cluster ignores is not free: kubelet
# warns on every pull and falls back to an anonymous one, so the namespace
# carries a standing warning while nothing is wrong — and a warning that is
# always present is the mechanism by which a real ImagePullBackOff later goes
# unread. The just-in-case cost is pointed at exactly the failure it was meant
# to soften.
#
# If the repository or its packages are ever made private, that is a deliberate
# act and this patch belongs with it: add imagePullSecrets [{name: ghcr-pull}]
# back onto the four Deployments and the migration Job. postgres and redis pull
# public docker.io images and never need it.

patches:
# --- Do not publish /mcp on the Gateway --------------------------------------
#
# charts/securo/templates/common/httproute.yaml welds a second rule
# (PathPrefix /mcp -> securo-mcp-server:8765) to `mcpServer.enabled`, with no
# separate toggle. Enabling the MCP server for the in-app agent therefore also
# publishes it on securo.local.luqmanlabs.com as a side effect. This declares
# the rules list outright so that side effect cannot happen.
#
# It is not needed: the agent reaches the server over the in-cluster
# AGENTS_BUILTIN_MCP_URL (http://securo-mcp-server:8765/mcp). The public URL
# exists for EXTERNAL MCP clients -- Claude Desktop, n8n -- which nothing here
# uses today.
#
# What it would expose is not a read-only view: mcp_server/tools/ carries
# transactions, accounts, budgets, payees, proposals and lifecycle handlers
# running straight against the database, authenticated by a single HS256 JWT
# and nothing else. `_assert_mcp_jwt_secret_is_usable` makes that JWT strong,
# but a strong lock on a door nobody needs is still a door.
#
# THIS REPLACES A POSITIONAL `op: remove /spec/rules/1`, WHICH WAS WRONG TWICE
# OVER and is worth recording rather than quietly improving:
#
#   1. It broke the moment mcpServer was toggled off. With one rule rendered,
#      `remove /spec/rules/1` is an invalid index and `kustomize build` FAILS
#      -- so Argo cannot sync at all. A patch that only works in one of two
#      supported states is a trap, not a fix.
#   2. Even while it worked, it was order-dependent: a chart that reordered or
#      inserted a rule would have made it delete the frontend catch-all,
#      taking the whole UI off the Gateway with every pod still Healthy.
#
# Declaring the list says what we want rather than where to cut. Kustomize
# replaces list values for CRD kinds it has no merge strategy for, so this is
# the whole `rules` list in both states: /mcp is absent because it is not
# written here, not because something removed it.
  - target:
      kind: HTTPRoute
      name: securo
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: securo
      spec:
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: securo-frontend
                port: 3000
  - target:
      kind: Job
      name: securo-migration
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: Sync
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook-delete-policy
        value: BeforeHookCreation

# --- Credential split, per homelab-security's contract -----------------------
#
# The chart offers exactly one knob, `global.existingSecret`, and setting it
# disables the chart's own generated Secret entirely -- so everything the app
# needs would normally have to live in that single object. It does not, on
# purpose, and the reason is rotation cost rather than tidiness:
#
#   securo-runtime            SECRET_KEY alone. Must NEVER change. It signs
#                             every session token and derives the Fernet key
#                             that encrypts the stored bank credential, so
#                             rotating it forges nothing but does strand the
#                             credential and force a manual reconnect.
#   securo-postgres           DATABASE_URL. A routine operation legitimately
#                             touches this -- a Postgres password rotation, or
#                             a move to an external database.
#   securo-openexchangerates  OPENEXCHANGERATES_APP_ID. Free to rotate at will.
#
# Keeping the two rotatable credentials out of `securo-runtime` means no
# routine operation ever has a reason to open the object holding the key that
# must not change. Under one combined Secret, rotating the cheap FX key means
# recreating the object that holds the expensive one, and one slip does it
# silently.
#
# The asymmetry below is deliberate, so do not tidy it into uniformity:
# DATABASE_URL goes to all four consumers INCLUDING the migration Job, which
# cannot connect without it and fails loudly -- the safe direction. The FX key
# goes only to the three long-running workloads; the Job has no use for it,
# and a missing FX key is a safe failure anyway (`openexchangerates_app_id`
# defaults to "" and conversion simply goes quiet).
#
# mcp-server was enabled on 2026-08-25 and this prediction held exactly: it
# consumes existingSecret in the chart, needs securo-postgres, and has no use
# for the FX key. Its patch is below, alongside the other three workloads.
# mcp-server talks to Postgres directly (backend/mcp_server/main.py imports
# async_session_maker), so without DATABASE_URL every tool call fails.
  - target:
      kind: Deployment
      name: securo-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: securo-postgres
  - target:
      kind: Deployment
      name: securo-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: securo-openexchangerates
  - target:
      kind: Deployment
      name: securo-beat
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: securo-postgres
  - target:
      kind: Deployment
      name: securo-beat
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: securo-openexchangerates
  - target:
      kind: Deployment
      name: securo-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: securo-postgres
  - target:
      kind: Deployment
      name: securo-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: securo-openexchangerates
  - target:
      kind: Job
      name: securo-migration
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: securo-postgres
  - target:
      kind: Deployment
      name: securo-mcp-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: securo-postgres
