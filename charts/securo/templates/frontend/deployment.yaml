apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "securo.fullname" . }}-frontend
  labels:
    {{- include "securo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "securo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/common/configmap.yaml") . | sha256sum }}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/frontend/configmap-nginx.yaml") . | sha256sum }}
      labels:
        {{- include "securo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            # Fully qualified on purpose. Since #696 the nginx config reaches the
            # backend through `set $upstream ${BACKEND_URL}` + `proxy_pass
            # $upstream`, which makes nginx do its own DNS instead of letting the
            # OS resolver do it. nginx's `resolver` does NOT apply the search
            # domains in /etc/resolv.conf, so a bare Service name is sent to
            # kube-dns as an absolute query and comes back NXDOMAIN — every /api
            # request 502s with "securo-backend could not be resolved (3: Host
            # not found)" while `wget http://securo-backend:8000` from the very
            # same pod succeeds, because glibc appends the search suffixes.
            #
            # That asymmetry is the whole trap: the pod's DNS is fine, so the
            # obvious checks all pass. Name the Service in full and nginx has
            # nothing left to guess.
            - name: BACKEND_URL
              value: "http://{{ include "securo.fullname" . }}-backend.{{ .Release.Namespace }}.svc.cluster.local:8000"
            - name: FRONTEND_URL
              value: {{ include "securo.frontendUrl" . | quote }}
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
          {{- if .Values.frontend.resources }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- end }}
      volumes:
        - name: nginx-template
          configMap:
            name: {{ include "securo.fullname" . }}-frontend-nginx
